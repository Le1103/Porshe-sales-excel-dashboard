<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Porsche Sales Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-color: #c9d1d9;
            --border-color: #30363d;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        header h1 {
            color: #ffffff;
            margin-bottom: 5px;
        }
        header p {
            color: #8b949e;
        }
        .charts-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 25px;
            max-width: 950px;
            margin: 0 auto;
        }
        .chart-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
        }
        .chart-card h3 {
            margin-top: 0;
            font-size: 18px;
            color: #ffffff;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }
        canvas {
            max-height: 380px;
        }
    </style>
</head>
<body>

    <header>
        <h1>🏎‍🟀 Porsche Sales Dashboard</h1>
        <p>Painel de Controle Excel de Vendas da Porsche — Projeto DIO</p>
    </header>

    <div class="charts-grid">
        <div class="chart-card">
            <h3>Faturamento por Modelo (Porsche)</h3>
            <canvas id="modelChart"></canvas>
        </div>
        <div class="chart-card">
            <h3>Faturamento por Método de Pagamento</h3>
            <canvas id="paymentChart"></canvas>
        </div>
        <div class="chart-card">
            <h3>Faturamento por Ano de Modelo</h3>
            <canvas id="yearChart"></canvas>
        </div>
    </div>

    <script>
        // 1. Faturamento por Modelo
        const ctxModel = document.getElementById('modelChart').getContext('2d');
        new Chart(ctxModel, {
            type: 'bar',
            data: {
                labels: [
                    '718 Boxster', '718 Boxster GTS', '718 Cayman', '718 Cayman GT4 RS', '718 Cayman S', 
                    '911 Carrera', '911 Carrera Cabriolet', '911 Carrera GTS', '911 Carrera S', '911 Dakar', 
                    '911 GT3', '911 Targa 4S', '911 Turbo', '911 Turbo S', 'Cayenne', 'Cayenne Coupe', 
                    'Cayenne E-Hybrid', 'Cayenne S', 'Cayenne Turbo', 'Cayenne Turbo GT', 'Macan', 
                    'Macan Electric', 'Macan GTS'
                ],
                datasets: [{
                    label: 'Soma de SalesPriceSanitized',
                    data: [
                        227400.15, 91500, 149800.08, 176400, 82750, 79900.04, 259800, 241650, 
                        200900, 348800.18, 79900.03, 238650.01, 198300, 556900.09, 235100.05, 
                        112750, 267000.12, 98200, 146800, 467900.17, 185400, 267500, 191800
                    ],
                    backgroundColor: '#1f6beb'
                }]
            },
            options: { responsive: true, plugins: { legend: { display: false } } }
        });

        // 2. Faturamento por Método de Pagamento
        const ctxPayment = document.getElementById('paymentChart').getContext('2d');
        new Chart(ctxPayment, {
            type: 'bar',
            indexAxis: 'y',
            data: {
                labels: ['Wire Transfer', 'Lease', 'Financing', 'Debit Card', 'Crypto Payment', 'Credit Card', 'Cash', 'Bank Transfer', 'ACH Payment'],
                datasets: [{
                    label: 'Soma de SalesPriceSanitized',
                    data: [458900.6, 684400.2, 915450.21, 1481400.32, 1014400.14, 227400.08, 633050.06, 1005900.32, 2024600.28],
                    backgroundColor: '#238636'
                }]
            },
            options: { responsive: true, plugins: { legend: { display: false } } }
        });

        // 3. Faturamento por Ano de Modelo
        const ctxYear = document.getElementById('yearChart').getContext('2d');
        new Chart(ctxYear, {
            type: 'bar',
            indexAxis: 'y',
            data: {
                labels: ['2020', '2021', '2022', '2023', '2024', '2025', '2026'],
                datasets: [{
                    label: 'Soma de SalesPriceSanitized',
                    data: [319700.16, 796950.22, 1090950.19, 1941500.76, 2219400.36, 1905800.43, 171200.09],
                    backgroundColor: '#daaa3f'
                }]
            },
            options: { responsive: true, plugins: { legend: { display: false } } }
        });
    </script>

</body>
</html>
