<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Porsche Sales Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-color: #c9d1d9;
            --accent-color: #f1e05a;
            --porsche-red: #d5001c;
            --border-color: #30363d;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        header h1 {
            color: #ffffff;
            margin-bottom: 5px;
        }
        header p {
            color: #8b949e;
        }
        .kpi-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .kpi-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }
        .kpi-card h3 {
            margin: 0 0 10px 0;
            font-size: 14px;
            color: #8b949e;
        }
        .kpi-card .value {
            font-size: 24px;
            font-weight: bold;
            color: #ffffff;
        }
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 20px;
        }
        .chart-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
        }
        .chart-card h3 {
            margin-top: 0;
            font-size: 16px;
            color: #ffffff;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }
        canvas {
            max-height: 300px;
        }
    </style>
</head>
<body>

    <header>
        <h1>🏎‍🟀 Porsche Sales Dashboard</h1>
        <p>Análise interativa de vendas baseada no projeto DIO</p>
    </header>

    <div class="kpi-container">
        <div class="kpi-card">
            <h3>Faturamento Total</h3>
            <div class="value">€ 14,850,000</div>
        </div>
        <div class="kpi-card">
            <h3>Total de Veículos Vendidos</h3>
            <div class="value">100 Unidades</div>
        </div>
        <div class="kpi-card">
            <h3>Modelo Mais Vendido</h3>
            <div class="value">911 GT3 / Turbo</div>
        </div>
    </div>

    <div class="charts-grid">
        <div class="chart-card">
            <h3>Faturamento por Modelo</h3>
            <canvas id="modelChart"></canvas>
        </div>
        <div class="chart-card">
            <h3>Faturamento por Método de Pagamento</h3>
            <canvas id="paymentChart"></canvas>
        </div>
        <div class="chart-card" style="grid-column: 1 / -1;">
            <h3>Faturamento por Ano do Modelo</h3>
            <canvas id="yearChart"></canvas>
        </div>
    </div>

    <script>
        // Gráfico de Faturamento por Modelo
        const ctxModel = document.getElementById('modelChart').getContext('2d');
        new Chart(ctxModel, {
            type: 'bar',
            data: {
                labels: ['718 Boxster', '718 Cayman', '911 Carrera', '911 GT3', 'Cayenne', 'Macan', 'Panamera', 'Taycan'],
                datasets: [{
                    label: 'Faturamento (€)',
                    data: [1200000, 1400000, 2100000, 2500000, 1900000, 1600000, 1800000, 2350000],
                    backgroundColor: '#d5001c'
                }]
            },
            options: { responsive: true, plugins: { legend: { display: false } } }
        });

        // Gráfico de Faturamento por Método de Pagamento
        const ctxPayment = document.getElementById('paymentChart').getContext('2d');
        new Chart(ctxPayment, {
            type: 'doughnut',
            data: {
                labels: ['Wire Transfer', 'Lease', 'Financing', 'Credit Card', 'Cash'],
                datasets: [{
                    data: [45, 20, 15, 12, 8],
                    backgroundColor: ['#d5001c', '#f1e05a', '#3fb950', '#58a6ff', '#8b949e']
                }]
            },
            options: { responsive: true }
        });

        // Gráfico por Ano do Modelo
        const ctxYear = document.getElementById('yearChart').getContext('2d');
        new Chart(ctxYear, {
            type: 'line',
            data: {
                labels: ['2020', '2021', '2022', '2023', '2024', '2025', '2026'],
                datasets: [{
                    label: 'Faturamento (€)',
                    data: [1500000, 1800000, 2100000, 2000000, 2400000, 2600000, 2450000],
                    borderColor: '#f1e05a',
                    backgroundColor: 'rgba(241, 224, 90, 0.1)',
                    fill: true,
                    tension: 0.3
                }]
            },
            options: { responsive: true }
        });
    </script>

</body>
</html>
